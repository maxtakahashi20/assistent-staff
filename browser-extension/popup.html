<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#0f1420; --card:#171e2e; --line:#26304a; --text:#e6e9f2; --muted:#8b93a7;
          --ok:#3ba55d; --warn:#e8a33d; --accent:#5865f2; }
  * { box-sizing: border-box; }
  body { margin:0; width:320px; background:var(--bg); color:var(--text);
         font:13px/1.4 system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--line); }
  header img { width:22px; height:22px; }
  header b { font-size:14px; letter-spacing:.3px; }
  section { padding:10px 14px; border-bottom:1px solid var(--line); }
  h2 { margin:0 0 6px; font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); }
  .status { display:flex; gap:8px; align-items:flex-start; padding:10px 14px; border-bottom:1px solid var(--line); }
  .dot { width:9px; height:9px; border-radius:50%; margin-top:4px; flex:none; background:var(--muted); }
  .status.ok .dot { background:var(--ok); }
  .status.warn .dot { background:var(--warn); }
  .status small { display:block; color:var(--muted); }
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; justify-content:space-between; gap:8px; padding:4px 0; }
  li span:last-child { color:var(--muted); white-space:nowrap; }
  .empty { color:var(--muted); }
  label { display:flex; justify-content:space-between; align-items:center; padding:4px 0; cursor:pointer; }
  input[type=checkbox] { accent-color:var(--accent); width:16px; height:16px; }
  button { width:100%; padding:8px; border:0; border-radius:6px; background:var(--accent);
           color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  button:focus-visible, input:focus-visible { outline:2px solid #fff; outline-offset:2px; }
</style>
</head>
<body>
  <header><img src="icon.png" alt=""><b>City Support — Fila</b></header>

  <div id="status" class="status" role="status">
    <span class="dot"></span>
    <div><span id="statusText">Carregando…</span><small id="statusHint"></small></div>
  </div>

  <section>
    <h2>Aguardando agora (<span id="count">0</span>)</h2>
    <ul id="queue"></ul>
  </section>

  <section>
    <h2>Últimas entradas</h2>
    <ul id="history"></ul>
  </section>

  <section>
    <h2>Avisos</h2>
    <label>Notificação na área de trabalho <input type="checkbox" id="notify"></label>
    <label>Som <input type="checkbox" id="sound"></label>
  </section>

  <section><button id="test">Testar aviso</button></section>

  <script src="popup.js"></script>
</body>
</html>
